      # - name: Trigger Repo sync
      #   run: |
      #     curl -X POST \
      #     -H "Authorization: token ${{ secrets.PAT }}" \
      #     -H "Accept: application/vnd.github.v3+json" \
      #     https://api.github.com/repos/iPhilip/Repo/dispatches \
      #     -d '{"event_type": "remotebuffer-updated"}'
